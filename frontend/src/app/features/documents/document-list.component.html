
<div class="p-6">
  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Documents</h1>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
        Manage documents
      </p>
    </div>
   
      <button
        (click)="openCreateForm()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors"
      >
        <span class="inline-flex items-center">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          New Document
        </span>
      </button>
  
  </div>
@if (showCreateForm()) {
  <app-document-create
    (cancel)="closeCreateForm()"
  />
}

  <div *ngIf="documents()?.length === 0">
    Aucun document trouvé.
  </div>

</div>
