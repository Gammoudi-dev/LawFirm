<div class="p-6 space-y-4">

  <!-- Header -->
  <div class="flex items-center gap-3">

    <a
      routerLink="/notes"
      title="Back to notes"
      class="p-1.5 text-gray-500 hover:text-indigo-600 dark:text-gray-400 dark:hover:text-indigo-400 rounded"
    >
      <span class="material-icons">arrow_back</span>
    </a>

    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
        Note details
      </h1>

      <p class="text-sm text-gray-500 dark:text-gray-400">
        View note information
      </p>
    </div>

  </div>


  <!-- Loading -->
  @if (loading) {

    <div
      class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 flex justify-center items-center h-40"
    >
      <div
        class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"
      ></div>
    </div>

  }

  <!-- Error -->
  @else if (errorMessage) {

    <div
      class="bg-white dark:bg-gray-800 rounded-xl border border-red-200 dark:border-red-800 p-6 text-center text-red-600 dark:text-red-400"
    >
      {{ errorMessage }}
    </div>

  }

  <!-- Note -->
  @else if (note) {

    <div
      class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden"
    >

      <!-- Header card -->
      <div
        class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700"
      >

        <div class="flex items-center gap-3">

          <div
            class="w-11 h-11 rounded-full bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center text-indigo-700 dark:text-indigo-300"
          >
            <span class="material-icons">sticky_note_2</span>
          </div>

          <div>
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
              {{ note.title }}
            </h2>

            <p class="text-sm text-gray-500 dark:text-gray-400">
              Note #{{ note.id }}
            </p>
          </div>

        </div>


        <!-- Edit -->
        <a
       [routerLink]="['/notes/edit', note.id]" 
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg flex items-center gap-2"
        >
          <span class="material-icons text-base">edit</span>
          Edit Note
        </a>

      </div>


      <!-- Details -->
      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- ID -->
        <div>
          <p
            class="text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            ID
          </p>

          <p class="mt-1 text-gray-900 dark:text-white">
            {{ note.id }}
          </p>
        </div>


        <!-- Title -->
        <div>
          <p
            class="text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            Title
          </p>

          <p class="mt-1 text-gray-900 dark:text-white">
            {{ note.title }}
          </p>
        </div>


        <!-- Content -->
        <div class="md:col-span-2">

          <p
            class="text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            Content
          </p>

          <p
            class="mt-1 text-gray-700 dark:text-gray-300 whitespace-pre-line"
          >
            {{ note.content }}
          </p>

        </div>

      </div>

    </div>

  }

</div>
