<div class="p-6 space-y-4">

  <!-- Header -->

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

<div>
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
    Notes
  </h1>

  <p class="text-sm text-gray-500 dark:text-gray-400">
    Manage your notes
  </p>
</div>
<div>
  <p class="text-sm text-gray-500 dark:text-gray-400">
    Total des notes : {{ noteCount() }}
  </p>
</div>
<button
  type="button"
  (click)="openCreateForm()"
  class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg flex items-center gap-2"
>
  <span class="material-icons text-base">add</span>
  New Note
</button>


  </div>

  <!-- Table -->

  <div
    class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden"
  >


@if (notes().length === 0) {

  <!-- Empty state -->
  <div class="p-12 text-center text-gray-500 dark:text-gray-400">

    <span class="material-icons text-5xl mb-3 block">
      sticky_note_2
    </span>

    <p>No notes found.</p>

  </div>

} @else {

  <div class="overflow-x-auto">

    <table class="w-full text-sm">

      <!-- Header -->
      <thead
        class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700"
      >

        <tr>

          <th
            class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300"
          >
            ID
          </th>

          <th
            class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300"
          >
            Title
          </th>

          <th
            class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300"
          >
            Content
          </th>

          <th
            class="px-4 py-3 text-right font-semibold text-gray-700 dark:text-gray-300"
          >
            Actions
          </th>

        </tr>

      </thead>


      <!-- Body -->
      <tbody class="divide-y divide-gray-100 dark:divide-gray-700">

        @for (note of notes(); track note.id) {

          <tr
            class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors"
          >

            <!-- ID -->
            <td
              class="px-4 py-3 font-medium text-gray-900 dark:text-white"
            >
              {{ note.id }}
            </td>


            <!-- Title -->
            <td
              class="px-4 py-3 font-medium text-gray-900 dark:text-white"
            >
              {{ note.title }}
            </td>


            <!-- Content -->
            <td
              class="px-4 py-3 text-gray-600 dark:text-gray-400 max-w-xl"
            >
              <div class="truncate">
                {{ note.content }}
              </div>
            </td>


            <!-- Actions -->
            <td class="px-4 py-3 text-right">

              <div class="flex justify-end gap-1">

                <!-- View -->
                <button
                  type="button"
                  [routerLink]="['/notes', note.id]"
                  title="View note"
                  class="p-1.5 text-gray-500 hover:text-indigo-600 dark:text-gray-400 dark:hover:text-indigo-400 rounded"
                >
                  <span class="material-icons text-base">
                    visibility
                  </span>
                </button>


                <!-- Edit -->
                <button
                  type="button"
                  [routerLink]="['/notes/edit', note.id]"
                  title="Edit note"
                  class="p-1.5 text-gray-500 hover:text-indigo-600 dark:text-gray-400 dark:hover:text-indigo-400 rounded"
                >
                  <span class="material-icons text-base">
                    edit
                  </span>
                </button>


                <!-- Delete -->
                <button
                  type="button"
                  (click)="deleteNote(note.id)"
                  title="Delete note"
                  class="p-1.5 text-gray-500 hover:text-red-600 dark:text-gray-400 dark:hover:text-red-400 rounded"
                >
                  <span class="material-icons text-base">
                    delete
                  </span>
                </button>

              </div>

            </td>

          </tr>

        }

      </tbody>

    </table>

  </div>

}


  </div>

  <!-- Popup création -->

@if (showCreateForm()) {

<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
  (click)="closeCreateForm()"
  (keydown.escape)="closeCreateForm()"
>

  <div
    class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()"
  >

    <app-note-create
      [embedded]="true"
      (cancelled)="closeCreateForm()"
      (created)="onNoteCreated()"
    ></app-note-create>

  </div>

</div>
s

}

</div>
